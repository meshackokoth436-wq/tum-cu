<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        var origOnError = window.onerror;
        window.onerror = function(msg, url, lineNo, columnNo, error) {
          var str = String(msg || '') + ' ' + String(url || '') + ' ' + String(error || '');
          if (
            str.indexOf('[vite]') !== -1 ||
            str.indexOf('vite-hmr') !== -1 ||
            str.indexOf('WebSocket') !== -1 ||
            str.indexOf('websocket') !== -1 ||
            str.indexOf('24678') !== -1
          ) {
            return true;
          }
          if (typeof origOnError === 'function') {
            return origOnError.apply(this, arguments);
          }
          return false;
        };

        var origOnUnhandled = window.onunhandledrejection;
        window.onunhandledrejection = function(e) {
          var reason = e && e.reason ? (e.reason.message || String(e.reason)) : '';
          if (
            reason.indexOf('[vite]') !== -1 ||
            reason.indexOf('WebSocket') !== -1 ||
            reason.indexOf('websocket') !== -1 ||
            reason.indexOf('24678') !== -1
          ) {
            if (e && e.preventDefault) e.preventDefault();
            return true;
          }
          if (typeof origOnUnhandled === 'function') {
            return origOnUnhandled.apply(this, arguments);
          }
        };

        var methods = ['error', 'warn', 'info', 'log', 'debug'];
        for (var i = 0; i < methods.length; i++) {
          (function(m) {
            var orig = console[m];
            if (typeof orig === 'function') {
              console[m] = function() {
                for (var j = 0; j < arguments.length; j++) {
                  var arg = arguments[j];
                  if (!arg) continue;
                  var s = (arg && (arg.message || arg.stack || arg.reason || arg.description))
                    ? String(arg.message || arg.stack || arg.reason || arg.description)
                    : String(arg);
                  if (
                    s.indexOf('[vite]') !== -1 ||
                    s.indexOf('vite-hmr') !== -1 ||
                    s.indexOf('failed to connect to websocket') !== -1 ||
                    s.indexOf('24678') !== -1
                  ) {
                    return;
                  }
                }
                return orig.apply(console, arguments);
              };
            }
          })(methods[i]);
        }

        if (typeof window !== 'undefined' && window.WebSocket) {
          var OriginalWebSocket = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            var urlStr = String(url || '');
            var protoStr = String(protocols || '');
            if (
              protoStr === 'vite-hmr' ||
              urlStr.indexOf('24678') !== -1 ||
              urlStr.indexOf('token=') !== -1 ||
              protoStr.indexOf('vite') !== -1
            ) {
              var listeners = {};
              var mockWs = {
                url: urlStr,
                readyState: 1,
                CONNECTING: 0,
                OPEN: 1,
                CLOSING: 2,
                CLOSED: 3,
                protocol: 'vite-hmr',
                extensions: '',
                bufferedAmount: 0,
                binaryType: 'blob',
                onopen: null,
                onclose: null,
                onerror: null,
                onmessage: null,
                addEventListener: function(type, fn) {
                  listeners[type] = listeners[type] || [];
                  listeners[type].push(fn);
                },
                removeEventListener: function(type, fn) {
                  if (!listeners[type]) return;
                  listeners[type] = listeners[type].filter(function(f) { return f !== fn; });
                },
                dispatchEvent: function() { return true; },
                send: function() {},
                close: function() {
                  mockWs.readyState = 3;
                }
              };
              return mockWs;
            }
            return new OriginalWebSocket(url, protocols);
          };
          window.WebSocket.prototype = OriginalWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }
      })();
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#006633" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TECUMP" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>TECUMP - TUMCU Management Platform</title>
    <meta name="description" content="TUMCU Enterprise Christian Union Management Platform with executive workflows, constitutional ministries, committees, RBAC, events, and membership management." />
    <meta property="og:title" content="TECUMP - TUMCU Management Platform" />
    <meta property="og:description" content="TUMCU Enterprise Christian Union Management Platform with executive workflows, constitutional ministries, committees, RBAC, events, and membership management." />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
